name: Discord Server Boosts Erinnerung

on:
  schedule:
    # Jeden 1. des Monats um 18:00 UTC
    - cron: "0 18 1 * *"

  # Ermöglicht zusätzlich einen manuellen Test
  workflow_dispatch:

jobs:
  send-discord-message:
    runs-on: ubuntu-latest

    steps:
      # Repository auschecken, damit boost-reminder.md verfügbar ist
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Nachricht an Discord senden
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq -Rs '{content: .}' boost-reminder.md > payload.json

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
